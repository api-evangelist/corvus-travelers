description: 'Corvus by Travelers is a cyber-insurance provider offering Smart Cyber Insurance and Smart
  Tech E&O coverage alongside data-driven cyber risk management. Now part of Travelers, Corvus underwrites
  cyber policies using threat intelligence and AI-driven data, and pairs coverage with continuous threat
  monitoring, vulnerability detection, a cyber risk dashboard, and 24/7 incident response and claims support.
  The business is broker-focused, distributing through appointed brokers via its Broker Hub and broker
  sign-in portal. Corvus was surfaced as a portfolio company of Bain Capital Ventures. As of this
  enrichment pass the company publishes no public developer API, API documentation, or developer portal.'
